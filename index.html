  /* ================================================================
     LOADING SCREEN
     ================================================================ */
  #ls {
    position: fixed;
    inset: 0;
    background: #050510;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    transition: opacity 0.75s ease;
  }
  #ls.ls-out { opacity: 0; pointer-events: none; }

  /* Sky gradient */
  .ls-sky {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 25%,
      rgba(100, 0, 160, 0.45) 0%,
      #050510 70%
    );
  }

  /* Stars */
  .ls-stars { position: absolute; inset: 0 0 35% 0; overflow: hidden; }
  .ls-star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle 3s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.15; }
    to   { opacity: 1; }
  }

  /* Synthwave sun */
  .ls-sun-wrap {
    position: absolute;
    top: 7%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(140px, 28vw, 210px);
    height: clamp(70px, 14vw, 105px);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    overflow: hidden;
    box-shadow:
      0 0 50px rgba(255, 42, 109, 0.55),
      0 0 100px rgba(211, 0, 197, 0.30),
      0 0 160px rgba(120, 0, 200, 0.18);
  }
  .ls-sun {
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom,
      #ffb347 0%,
      #ff2a6d 30%,
      #d300c5 60%,
      #7700a6 90%
    );
  }
  /* Horizontal stripe mask: covers bottom ~55% of sun */
  .ls-sun-stripes {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 5px,
      #050510 5px,
      #050510 9px
    );
    -webkit-mask: linear-gradient(to bottom, transparent 42%, black 78%);
    mask:         linear-gradient(to bottom, transparent 42%, black 78%);
  }

  /* Perspective grid */
  .ls-grid-wrap {
    position: absolute;
    bottom: 19%;
    left: 0;
    width: 100%;
    height: 56%;
    perspective: 220px;
    perspective-origin: 50% 0%;
  }
  .ls-grid {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 300%;
    background-image:
      linear-gradient(rgba(5, 217, 232, 0.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(5, 217, 232, 0.30) 1px, transparent 1px);
    background-size: 80px 80px;
    transform: rotateX(68deg);
    transform-origin: center bottom;
    animation: gridScroll 1.4s linear infinite;
  }
  @keyframes gridScroll {
    from { background-position: 0 0; }
    to   { background-position: 0 80px; }
  }
  /* Fade at the horizon */
  .ls-grid-wrap::after {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 42%;
    background: linear-gradient(to bottom, #050510, transparent);
    z-index: 1;
  }

  /* Horizon glow line */
  .ls-horizon {
    position: absolute;
    bottom: 19%;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(
      to right,
      transparent 0%,
      var(--np, #ff2a6d) 20%,
      var(--nm, #d300c5) 50%,
      var(--np, #ff2a6d) 80%,
      transparent 100%
    );
    box-shadow: 0 0 18px rgba(255, 42, 109, 0.7);
    z-index: 5;
  }

  /* Road */
  .ls-road {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 19%;
    background: #060618;
    overflow: hidden;
    z-index: 4;
  }
  .ls-road::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: rgba(5, 217, 232, 0.5);
    box-shadow: 0 0 10px rgba(5, 217, 232, 0.4);
  }
  /* Scrolling dashes via background-position */
  .ls-road-dashes {
    position: absolute;
    top: calc(48% - 2px);
    left: 0;
    width: 100%;
    height: 4px;
    background: repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.38) 0px,
      rgba(255,255,255,0.38) 55px,
      transparent 55px,
      transparent 100px
    );
    animation: dashScroll 0.55s linear infinite;
  }
  @keyframes dashScroll {
    from { background-position-x: 0; }
    to   { background-position-x: -100px; }
  }
  /* Road shoulder lines */
  .ls-road-left, .ls-road-right {
    position: absolute;
    bottom: 8%;
    height: 2px;
    width: 18%;
    background: rgba(255, 42, 109, 0.4);
  }
  .ls-road-left  { left: 0; }
  .ls-road-right { right: 0; }

  /* Car wrapper — sits on the road surface */
  .ls-car-scene {
    position: absolute;
    bottom: 19%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    line-height: 0;
  }
  .ls-car-svg {
    width: clamp(230px, 44vw, 320px);
    height: auto;
    display: block;
  }

  /* Wheel spin */
  .wheel-spokes {
    transform-box: fill-box;
    transform-origin: center;
    animation: spinWheel 0.38s linear infinite;
  }
  @keyframes spinWheel {
    to { transform: rotate(360deg); }
  }

  /* HUD */
  .ls-hud {
    position: absolute;
    bottom: 2.5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    width: min(82%, 500px);
  }
  .ls-title {
    font-size: clamp(0.8rem, 2.8vw, 1.2rem);
    color: #05d9e8;
    letter-spacing: 0.55em;
    text-shadow: 0 0 12px #05d9e8, 0 0 28px rgba(5,217,232,0.4);
    margin-bottom: 10px;
  }
  .ls-cursor {
    animation: blink 1s step-end infinite;
    color: #ff2a6d;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

  .ls-bar {
    height: 4px;
    background: rgba(5, 217, 232, 0.1);
    border: 1px solid rgba(5, 217, 232, 0.25);
    margin-bottom: 7px;
    overflow: visible;
    position: relative;
  }
  #ls-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #d300c5, #ff2a6d, #05d9e8);
    position: relative;
    transition: width 0.12s linear;
  }
  #ls-fill::after {
    content: '';
    position: absolute;
    right: -1px; top: -4px;
    width: 3px; height: 12px;
    background: #05d9e8;
    box-shadow: 0 0 8px #05d9e8, 0 0 18px #05d9e8;
  }
  .ls-pct-label {
    font-size: 0.6rem;
    color: rgba(5,217,232,0.55);
    letter-spacing: 0.3em;
  }
  #ls-pct { color: #ff2a6d; text-shadow: 0 0 6px #ff2a6d; }
  </style>

<!-- Inline script runs immediately so stars appear before fonts load -->
<script>
// ── Generate stars ──────────────────────────────────────────────
(function () {
  var c = document.getElementById('ls-stars');
  if (!c) return;
  for (var i = 0; i < 72; i++) {
    var s  = document.createElement('div');
    s.className = 'ls-star';
    var sz = Math.random() * 2.4 + 0.4;
    s.style.cssText =
      'width:'            + sz             + 'px;'  +
      'height:'           + sz             + 'px;'  +
      'top:'              + Math.random() * 100 + '%;'  +
      'left:'             + Math.random() * 100 + '%;'  +
      'animation-delay:'  + (Math.random() * 3).toFixed(2) + 's;' +
      'animation-duration:' + (2 + Math.random() * 2).toFixed(2) + 's;';
    c.appendChild(s);
  }
})();

// ── Loading progress ────────────────────────────────────────────
(function () {
  var screen = document.getElementById('ls');
  var fill   = document.getElementById('ls-fill');
  var label  = document.getElementById('ls-pct');
  if (!screen) return;

  var start     = Date.now();
  var MIN_MS    = 3000;   // always show for at least 3 s
  var pageReady = false;
  var raf;

  function update () {
    var elapsed = (Date.now() - start) / 1000;
    // Smooth ease-out curve; stalls near 92% until page is ready
    var target  = pageReady ? 1 : Math.min(0.92, 1 - Math.pow(1 - Math.min(elapsed / 2.8, 1), 1.9));
    var current = parseFloat(fill.style.width || '0') / 100;
    current     = current + (target - current) * 0.06;

    fill.style.width    = (current * 100).toFixed(2) + '%';
    label.textContent   = Math.floor(current * 100);

    if (current < 0.999) {
      raf = requestAnimationFrame(update);
    } else {
      dismiss();
    }
  }

  function dismiss () {
    cancelAnimationFrame(raf);
    fill.style.width  = '100%';
    label.textContent = '100';
    setTimeout(function () {
      screen.classList.add('ls-out');
      setTimeout(function () { screen.style.display = 'none'; }, 780);
    }, 280);
  }

  // Release the bar to 100% once page is fully loaded AND min time has passed
  window.addEventListener('load', function () {
    var elapsed = Date.now() - start;
    var wait    = Math.max(0, MIN_MS - elapsed);
    setTimeout(function () { pageReady = true; }, wait);
  });

  // Safety net — always hide after 8 s
  setTimeout(function () { pageReady = true; }, 8000);

  requestAnimationFrame(update);
})();
</script>
